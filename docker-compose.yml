services:
  web:
    # Image publiée par GitHub Actions à chaque mise à jour de main.
    # `pull_policy: always` : chaque `docker compose up -d` récupère la
    # dernière version avant de (re)démarrer le conteneur.
    image: ghcr.io/r0m1k3/collectflow:latest
    pull_policy: always
    # Construction locale possible : `docker compose build` (utilise le Dockerfile).
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5643:5643"
    environment:
      # Secret de session : sans AUTH_SECRET, un secret aléatoire est généré au
      # premier démarrage et conservé dans le volume (data/.auth-secret).
      # Pour en imposer un : AUTH_SECRET=<openssl rand -hex 32> dans .env.
      - AUTH_SECRET=${AUTH_SECRET:-}
      # Mot de passe du compte admin créé sur une base vide (sinon aléatoire,
      # affiché une fois dans les journaux : docker compose logs web).
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - DATABASE_URL=postgres://postgres:MOT_DE_PASSE_ICI@postgresbase:5432/collectflow
      - FF_API_BASE_URL=https://api.ffnancy.fr
      # Clé d'API FF Nancy (en-tête X-API-Key) — ou à saisir dans Paramètres.
      # - FF_API_KEY=VOTRE_CLE_ICI
      # La base, Qlik et l'API FF se règlent aussi depuis l'interface (Paramètres).
    volumes:
      - collectflow-data:/app/data
    restart: unless-stopped
    # Petit init (tini) en PID 1 : récupère les processus Chromium arrêtés
    # (sinon ils restent à l'état zombie sous le serveur).
    init: true
    # Plafond mémoire : en cas de fuite, le conteneur redémarre au lieu
    # d'étouffer la machine. Volontairement large au départ (la synchro de nuit
    # d'un gros fournisseur et Chromium s'additionnent) ; à abaisser d'après les
    # lignes `[memoire]` des journaux.
    mem_limit: 3g
    networks:
      - nginx_default

volumes:
  collectflow-data:
    name: collectflow-data

networks:
  nginx_default:
    external: true
